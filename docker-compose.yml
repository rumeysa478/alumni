services:
  # Node.js Express Web Application & REST API
  web:
    build: .
    container_name: alumni_web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-your_secure_password}
      - DB_NAME=${DB_NAME:-alumni_db}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-your_secure_password}@postgres_db:5432/${DB_NAME:-alumni_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      # Uploads persistent volume (CVs, profile photos)
      - uploads_data:/app/uploads
    networks:
      - alumni_network

  # PostgreSQL Relational Database
  postgres_db:
    image: postgres:15-alpine
    container_name: alumni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${DB_NAME:-alumni_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # 🌟 THE FORGETTING TEST SECRET 🌟
      # Bu isimlendirilmiş birim (Named Volume), 'docker compose down' ile konteyner silinse dahi
      # veritabanı kayıtlarının host üzerinde kalıcı (persistent) kalmasını sağlar.
      # 'docker compose up' ile yeniden başlatıldığında veriler asla UNUTULMAZ!
      - postgres_data:/var/lib/postgresql/data
      # İlk başlatmada şema ve tohum verileri otomatik yüklenir:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-alumni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alumni_network

# Kalıcı Veri Saklama Birimleri (Persistent Named Volumes)
volumes:
  # The Forgetting Test Secret: postgres_data survives 'docker compose down'
  postgres_data:
    driver: local
  # Medya ve dosya yüklemeleri için kalıcı birim
  uploads_data:
    driver: local

# Servisler arası izole ağ (Isolated Bridge Network)
networks:
  alumni_network:
    driver: bridge
